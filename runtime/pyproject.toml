[project]
name = "aip-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "agno>=2.6.22",
    "anthropic>=0.116.0",
    "fastapi>=0.139.0",
    "openai>=2.44.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.50.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
