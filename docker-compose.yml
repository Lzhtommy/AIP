services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai
    ports:
      - "5532:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/pg-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai"]
      interval: 5s
      timeout: 3s
      retries: 10

  runtime:
    build: ./runtime
    environment:
      RUNTIME_DB_URL: postgresql+psycopg://ai:ai@postgres:5432/ai
      OS_SECURITY_KEY: ${OS_SECURITY_KEY:?请在 .env 中设置 OS_SECURITY_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEMO_MODEL_ID: ${DEMO_MODEL_ID:-gpt-4.1-mini}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: postgres,localhost,127.0.0.1
    ports:
      - "7777:7777"
    depends_on:
      postgres:
        condition: service_healthy

  console:
    build: ./console
    environment:
      OS_ENDPOINT_URL: http://runtime:7777
      OS_SECURITY_KEY: ${OS_SECURITY_KEY:?请在 .env 中设置 OS_SECURITY_KEY}
      DATABASE_URL: postgresql://ai:ai@postgres:5432/console
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env 中设置 AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      runtime:
        condition: service_started

volumes:
  pg_data:
